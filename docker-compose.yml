version: '3.8'

services:
  backend:
    build: ./backend
    container_name: pgpuss-backend
    env_file:
      - .env
    ports:
      - "8000:8000"
    restart: unless-stopped
    # Pas besoin de volumes bind-mount en production
    # La commande CMD est définie dans le Dockerfile (gunicorn)

  frontend:
    build: ./frontend
    container_name: pgpuss-frontend
    ports:
      - "80:80"
    depends_on:
      - backend
      - openwa
    restart: unless-stopped

  openwa:
    build:
      context: ./OpenWA
      dockerfile: Dockerfile
    container_name: pgpuss-openwa
    ports:
      - "2785:2785"
    environment:
      - NODE_ENV=production
      - PORT=2785
      - DATABASE_TYPE=sqlite
      - DATABASE_NAME=/app/data/openwa.sqlite
      - DATABASE_SYNCHRONIZE=true
      - ENGINE_TYPE=whatsapp-web.js
      - SESSION_DATA_PATH=/app/data/sessions
      - PUPPETEER_HEADLESS=true
      - PUPPETEER_ARGS=--no-sandbox,--disable-setuid-sandbox,--disable-dev-shm-usage,--disable-gpu
      - STORAGE_TYPE=local
      - STORAGE_LOCAL_PATH=/app/data/media
      - WEBHOOK_TIMEOUT=10000
      - WEBHOOK_MAX_RETRIES=3
      - QUEUE_ENABLED=false
      - API_MASTER_KEY=${OPENWA_API_KEY}
    volumes:
      - openwa_data:/app/data
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"

  openwa-dashboard:
    build:
      context: ./OpenWA/dashboard
      dockerfile: Dockerfile
    container_name: pgpuss-openwa-dashboard
    ports:
      - "2886:80"
    depends_on:
      - openwa
    restart: unless-stopped

volumes:
  openwa_data:
