services:
  backend:
    build: ./backend
    container_name: pgpuss-backend
    env_file:
      - .env
    ports:
      - "8000:8000"
    depends_on:
      - redis
    restart: unless-stopped
    volumes:
      - backend_media:/app/media  # Volume for media files
    # La commande CMD est définie dans le Dockerfile (gunicorn)

  frontend:
    build: ./frontend
    container_name: pgpuss-frontend
    ports:
      - "80:80"
    depends_on:
      - backend
      - openwa
    restart: unless-stopped

  openwa:
    build:
      context: ./OpenWA
      dockerfile: Dockerfile
    container_name: pgpuss-openwa
    ports:
      - "2785:2785"
    environment:
      - NODE_ENV=production
      - PORT=2785
      - DATABASE_TYPE=sqlite
      - DATABASE_NAME=/app/data/openwa.sqlite
      - DATABASE_SYNCHRONIZE=true
      - ENGINE_TYPE=whatsapp-web.js
      - SESSION_DATA_PATH=/app/data/sessions
      - PUPPETEER_HEADLESS=true
      - PUPPETEER_ARGS=--no-sandbox,--disable-setuid-sandbox,--disable-dev-shm-usage,--disable-gpu,--disable-software-rasterizer,--no-zygote,--disable-features=DialMediaRouteProvider,--remote-debugging-port=9222
      
      - STORAGE_TYPE=local
      - STORAGE_LOCAL_PATH=/app/data/media
      - WEBHOOK_TIMEOUT=10000
      - WEBHOOK_MAX_RETRIES=3
      - QUEUE_ENABLED=false
      - API_MASTER_KEY=${OPENWA_API_KEY}
    volumes:
      - openwa_data:/app/data
    restart: unless-stopped
    shm_size: '1gb'
    cap_add:
      - SYS_ADMIN
    security_opt:
      - seccomp=unconfined
    extra_hosts:
      - "host.docker.internal:host-gateway"

  openwa-dashboard:
    build:
      context: ./OpenWA/dashboard
      dockerfile: Dockerfile
    container_name: pgpuss-openwa-dashboard
    ports:
      - "2886:80"
    depends_on:
      - openwa
    restart: unless-stopped

  celery-worker:
    build: ./backend
    container_name: pgpuss-celery-worker
    env_file:
      - .env
    command: celery -A config worker --loglevel=info --concurrency=2
    depends_on:
      - redis
      - backend
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: pgpuss-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped

volumes:
  openwa_data:
  redis_data:
  backend_media:  # Volume to persist backend media files
