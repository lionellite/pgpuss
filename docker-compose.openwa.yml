# OpenWA seul — sans lancer le reste de PGP-USS
# Usage : cp .env.example .env && docker compose -f docker-compose.openwa.yml up -d
# OPENWA_API_KEY est injectée dans OpenWA comme API_MASTER_KEY lorsqu’elle est définie.

services:
  openwa:
    build:
      context: ./OpenWA
      dockerfile: Dockerfile
    container_name: pgpuss-openwa
    ports:
      - "2785:2785"
      - "2886:80"
    environment:
      - NODE_ENV=development
      - PORT=2785
      - DATABASE_TYPE=sqlite
      - DATABASE_NAME=/app/data/openwa.sqlite
      - DATABASE_SYNCHRONIZE=true
      - ENGINE_TYPE=whatsapp-web.js
      - SESSION_DATA_PATH=/app/data/sessions
      - PUPPETEER_HEADLESS=true
      - PUPPETEER_ARGS=--no-sandbox,--disable-setuid-sandbox,--disable-dev-shm-usage,--disable-gpu
      - STORAGE_TYPE=local
      - STORAGE_LOCAL_PATH=/app/data/media
      - WEBHOOK_TIMEOUT=10000
      - WEBHOOK_MAX_RETRIES=3
      - QUEUE_ENABLED=false
      - API_MASTER_KEY=${OPENWA_API_KEY:-}
    volumes:
      - openwa_data:/app/data
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "require('http').get('http://localhost:2785/api/health', (r) => process.exit(r.statusCode === 200 ? 0 : 1))",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

volumes:
  openwa_data:
